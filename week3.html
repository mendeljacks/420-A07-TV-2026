<head>
  <title>Week 3</title>
  <style>
    .square {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      background-color: #ccc;
      font-size: 5em;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 4em; color: RebeccaPurple">hello this is week 3</h1>
  <h2 style="font-size: 2em; color: OliveDrab">This is a subheading</h2>
  <div
    style="
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, 100px);
      justify-content: center;
    "
  >
    <div class="square">1</div>
    <div class="square">2</div>
    <div class="square">3</div>
    <div class="square">4</div>
  </div>
</body>
