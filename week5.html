<h3>My Table</h3>
<table id="table"></table>
<script>
  // Enter some javascript code here to make a table
  (async () => {
    const my_collection = await (
      await fetch("https://jsonplaceholder.typicode.com/users")
    ).json();

    document.getElementById("table").innerHTML = `
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      ${my_collection
        .map(
          (item) => `
          <tr style="background-color: ${item.id % 2 === 0 ? "lightgray" : "white"}">
            <td>${item.name}</td>
            <td>${item.email}</td>
          </tr>
        `,
        )
        .join("")}
    </tbody>
  `;
  })();
</script>
